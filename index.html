<style>
/* Fonts: system stacks from shared/design/tokens.css. UI colors are set by ui.js (palette.js UI_THEME). */
:root {
  --font-serif-victorian: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
  --font-deco: "Century Gothic", Futura, "Avenir Next", "Trebuchet MS", "Gill Sans", sans-serif;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-frontier: Georgia, "Times New Roman", serif;
  --font-body-serif: Alegreya, Georgia, "Times New Roman", serif;
  --font-body-sans: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --disp-frontier: "IM Fell English", Georgia, serif;
  --disp-victorian: "Playfair Display", Georgia, serif;
  --disp-deco: "Josefin Sans", "Century Gothic", sans-serif;
  --disp-mid: Righteous, "Arial Black", sans-serif;
  --disp-modern: Outfit, system-ui, sans-serif;
  --ui-display: var(--disp-victorian);
  --ui-bg: #F2EFE8; --ui-fg: #1F2A24; --ui-accent: #A9432C; --ui-accent-fg: #fff; --ui-muted: #5A4C38; --ui-border: #D9A23A;
  --ui-font: var(--font-serif-victorian);
  --r: 10px;
  font-size: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #1a1612; color: var(--ui-fg); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }
#nightfx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#wipe { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 30; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--ui-accent); outline-offset: 2px; }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: flex-start; padding: 8px; pointer-events: none; z-index: 5; font-family: var(--ui-font); }
#hud > * { pointer-events: auto; }
.panel-s { background: var(--ui-bg); color: var(--ui-fg); border: 2px solid var(--ui-border); border-radius: var(--r); padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.hud-l { min-width: 9.5rem; }
.h-date { font-weight: 700; font-size: 1.02rem; font-family: var(--ui-display); letter-spacing: .01em; }
.h-row { display: flex; gap: 8px; align-items: center; font-size: 0.95rem; }
.h-time { font-variant-numeric: tabular-nums; font-weight: 700; }
.h-wx { color: var(--ui-muted); }
.h-quest { max-width: 22rem; font-size: 0.92rem; line-height: 1.28; }
.h-quest b { display: block; font-family: var(--ui-display); font-size: 0.82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ui-muted); }
.h-quest .q { display: flex; gap: 6px; }
.h-quest .q.done { color: var(--ui-muted); text-decoration: line-through; }
.h-quest .zone { font-weight: 700; font-family: var(--ui-display); color: var(--ui-accent); font-size: 0.9rem; margin-bottom: 2px; }
.hud-r { margin-left: auto; display: flex; gap: 8px; align-items: flex-start; }
.h-stats { min-width: 9rem; }
.h-money { font-weight: 700; font-size: 1.12rem; font-family: var(--ui-display); font-variant-numeric: tabular-nums; }
.h-energy { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.h-energy .bar { flex: 1; height: 10px; min-width: 70px; background: rgba(0,0,0,.25); border-radius: 5px; overflow: hidden; border: 1px solid var(--ui-fg); }
.h-energy .bar i { display: block; height: 100%; background: #4caf50; }
.h-energy.low .bar i { background: #e04a3a; }
.h-btns { display: flex; gap: 6px; }
.hbtn { width: 46px; height: 46px; border-radius: var(--r); border: 2px solid var(--ui-border); background: var(--ui-bg); font-size: 1.3rem; box-shadow: 0 2px 8px rgba(0,0,0,.35); }

/* Hotbar */
.hotbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; background: var(--ui-bg); border: 2px solid var(--ui-border); border-radius: var(--r); z-index: 5; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
.slot { position: relative; width: 52px; height: 52px; border-radius: 8px; border: 2px solid transparent; background: rgba(0,0,0,.12); padding: 0; display: grid; place-items: center; }
.slot img { width: 40px; height: 40px; pointer-events: none; }
.slot .n { position: absolute; right: 1px; bottom: 1px; font-size: 0.72rem; font-weight: 700; color: #fff; background: rgba(16,14,12,.88); border-radius: 4px; padding: 0 3px; line-height: 1.25; font-family: var(--font-sans); }
.slot .k { position: absolute; left: 3px; top: 1px; font-size: 0.65rem; font-weight: 700; color: var(--ui-fg); font-family: var(--font-sans); }
.slot.sel { border-color: var(--ui-accent); background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 2px var(--ui-bg), 0 0 0 1px var(--ui-fg); }
.slot .jug { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 4px; background: rgba(0,0,0,.3); border-radius: 2px; }
.slot .jug i { display: block; height: 100%; background: #4fc3ff; border-radius: 2px; }
.prompt { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: rgba(16,14,12,.85); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.9rem; z-index: 5; white-space: nowrap; }

/* Toasts */
.toasts { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 12; pointer-events: none; width: min(92vw, 34rem); }
.toast { background: rgba(16,14,12,.9); color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 0.9rem; text-align: center; border-left: 4px solid #8aa; }
.toast.good { border-left-color: #5cc864; } .toast.warn { border-left-color: #f0a030; } .toast.quest { border-left-color: #f4c542; font-weight: 700; }

/* Touch */
#touch { position: absolute; inset: auto 0 0 0; height: 0; z-index: 6; }
.pad { position: absolute; left: 14px; bottom: 76px; width: 136px; height: 136px; border-radius: 50%; background: rgba(16,14,12,.35); border: 2px solid rgba(255,255,255,.55); touch-action: none; }
.pad .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(255,255,255,.65); border: 2px solid rgba(16,14,12,.6); }
.abtns { position: absolute; right: 12px; bottom: 80px; display: flex; gap: 12px; align-items: flex-end; }
.tbtn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(16,14,12,.7); background: rgba(255,250,235,.85); color: #1a1612; font-weight: 800; font-size: 1.3rem; display: grid; place-items: center; line-height: 1; padding: 0; touch-action: none; }
.tbtn small { font-size: 0.6rem; font-weight: 700; }
.tb-a { width: 72px; height: 72px; background: rgba(244,197,66,.95); margin-bottom: 18px; }

/* Screens and panels */
.screen { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10,8,6,.55); padding: 12px; font-family: var(--ui-font); }
.screen.title { background: transparent; }
.panel { background: var(--ui-bg); color: var(--ui-fg); border: 3px solid var(--ui-border); border-radius: 14px; width: min(46rem, 100%); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow: auto; padding: 16px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.panel h2 { margin: 0 0 8px; font-size: 1.5rem; font-family: var(--ui-display); font-weight: 700; letter-spacing: .01em; }
.panel h3 { margin: 12px 0 6px; font-size: 1.12rem; font-family: var(--ui-display); }
.panel p { margin: 6px 0; line-height: 1.45; }
.muted { color: var(--ui-muted); }
.small { font-size: 0.85rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.btn { min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 9px; border: 2px solid var(--ui-fg); background: transparent; color: var(--ui-fg); font-weight: 700; }
.btn.primary { background: var(--ui-accent); color: var(--ui-accent-fg); border-color: var(--ui-accent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 44px; padding: 4px 10px; font-size: 0.9rem; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tab { min-height: 44px; padding: 6px 12px; border-radius: 9px; border: 2px solid var(--ui-border); background: transparent; font-weight: 700; }
.tab.on { background: var(--ui-accent); color: var(--ui-accent-fg); border-color: var(--ui-accent); }
.grid { display: grid; grid-template-columns: repeat(8, 52px); gap: 6px; justify-content: center; }
.grid .slot { background: rgba(0,0,0,.1); border-color: rgba(0,0,0,.15); }
.grid .slot.pick { border-color: var(--ui-accent); background: rgba(255,255,255,.25); }
.detail { min-height: 4.2rem; margin-top: 10px; padding: 8px 10px; border: 2px dashed var(--ui-border); border-radius: 9px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.li { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 9px; background: rgba(0,0,0,.06); }
.li img { width: 36px; height: 36px; flex: none; }
.li .grow { flex: 1; min-width: 0; }
.li .price { font-weight: 700; font-variant-numeric: tabular-nums; }
.li.done { opacity: .75; }
.fact { padding: 8px 10px; border-left: 4px solid var(--ui-accent); background: rgba(0,0,0,.06); border-radius: 6px; margin: 8px 0; }
.fact .src { display: block; font-size: 0.8rem; color: var(--ui-muted); margin-top: 3px; word-break: break-word; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1.5px solid currentColor; margin-right: 4px; }
.hearts { letter-spacing: 1px; }
.kbd { display: inline-block; min-width: 1.6em; padding: 0 5px; border: 1.5px solid var(--ui-fg); border-radius: 4px; font-family: var(--font-sans); font-size: 0.85em; text-align: center; }
table.keys { border-collapse: collapse; width: 100%; }
table.keys td { padding: 4px 6px; border-bottom: 1px solid rgba(0,0,0,.12); vertical-align: middle; }

/* Dialogue */
.dialog { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(44rem, calc(100vw - 20px)); z-index: 22; display: flex; gap: 12px; align-items: flex-start; }
.dialog .portrait { width: 84px; height: 112px; flex: none; border-radius: 10px; border: 3px solid var(--ui-border); background: var(--ui-bg); }
.dialog .panel { width: auto; flex: 1; padding: 12px 14px; }
.dialog .who { font-weight: 700; font-size: 1.25rem; font-family: var(--ui-display); }
.dialog .role { font-size: 0.82rem; color: var(--ui-muted); }
.dialog .text { margin: 8px 0; font-size: 1.02rem; line-height: 1.45; }

/* Title */
.title-wrap { text-align: center; color: #fff; width: min(40rem, 100%); }
.title-wrap .brand { display: inline-block; padding: 12px 28px 6px; margin-bottom: 16px; background: radial-gradient(ellipse at center, rgba(16,12,8,.5), rgba(16,12,8,0) 70%); }
.title-wrap h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: clamp(2.4rem, 8vw, 4.4rem); margin: 0; color: #fff4dc; text-shadow: 0 2px 0 #5a3418, 0 4px 0 rgba(40,20,8,.6), 0 0 26px rgba(0,0,0,.55); line-height: 1.02; }
.title-wrap .sub { font-family: "Josefin Sans", var(--font-deco); color: #f6e7c4; font-size: clamp(1rem, 3.6vw, 1.35rem); letter-spacing: .18em; text-transform: uppercase; margin: 6px 0 8px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
.title-menu { display: grid; gap: 10px; width: min(20rem, 100%); margin: 0 auto; background: var(--ui-bg); color: var(--ui-fg); padding: 14px; border-radius: 14px; border: 3px solid var(--ui-border); }
.title-menu .btn { width: 100%; }
.title-note { margin-top: 12px; font-size: 0.85rem; background: rgba(16,14,12,.78); color: #fff; padding: 6px 10px; border-radius: 8px; display: inline-block; }

/* Cards */
.card-era { text-transform: uppercase; letter-spacing: .1em; font-size: 0.8rem; color: var(--ui-muted); font-weight: 800; }

/* High contrast */
body.hc .panel-s, body.hc .panel, body.hc .hotbar { border-width: 3px; }
body.hc .toast { background: #000; }

@media (max-width: 699px) {
  #hud { padding: 6px; gap: 6px; flex-wrap: wrap; }
  .hud-l { min-width: 0; padding: 4px 8px; }
  .h-date { font-size: 0.8rem; } .h-row { font-size: 0.85rem; }
  .h-stats { min-width: 0; padding: 4px 8px; } .h-money { font-size: 0.95rem; }
  .h-energy .bar { min-width: 46px; }
  .h-quest { order: 5; flex-basis: 100%; max-width: none; font-size: 0.78rem; padding: 4px 8px; }
  .h-quest .q:nth-child(n+3) { display: none; }
  .hbtn { width: 44px; height: 44px; font-size: 1.1rem; }
  .h-btns { gap: 4px; }
  .hud-r { gap: 6px; }
  .hotbar { bottom: 6px; gap: 2px; padding: 3px; }
  .slot { width: 44px; height: 44px; }
  .slot img { width: 34px; height: 34px; }
  .prompt { bottom: 228px; font-size: 0.82rem; }
  .grid { grid-template-columns: repeat(6, 44px); }
  .grid .slot { width: 44px; height: 44px; }
  .toasts { top: 132px; }
  .dialog { bottom: 8px; }
  .dialog .portrait { width: 60px; height: 80px; }
  .panel { padding: 12px; }
}

/* ---------- visual pass: framed panels, inset slots, chunkier HUD ---------- */
.panel, .panel-s, .title-menu {
  background-color: var(--ui-bg);
  background-image: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.07), rgba(255,255,255,0) 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,.018) 0 2px, rgba(255,255,255,.018) 2px 4px);
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 3px var(--ui-bg), inset 0 0 0 4px color-mix(in srgb, var(--ui-border) 70%, transparent), 0 10px 28px rgba(0,0,0,.45);
}
.panel { border-width: 3px; }
.panel h2 { padding-bottom: 6px; border-bottom: 1px solid color-mix(in srgb, var(--ui-border) 55%, transparent); }
.slot { background: color-mix(in srgb, var(--ui-fg) 9%, var(--ui-bg)); box-shadow: inset 0 2px 4px rgba(0,0,0,.35), inset 0 -1px 0 rgba(255,255,255,.08); border-color: color-mix(in srgb, var(--ui-border) 60%, transparent); }
.slot.sel, .slot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ui-accent), inset 0 2px 4px rgba(0,0,0,.25); }
.slot img { filter: drop-shadow(0 2px 1px rgba(0,0,0,.35)); }
.hotbar { box-shadow: 0 0 0 1px rgba(0,0,0,.4), inset 0 0 0 3px var(--ui-bg), inset 0 0 0 4px color-mix(in srgb, var(--ui-border) 70%, transparent), 0 8px 22px rgba(0,0,0,.45); }
.btn { box-shadow: inset 0 -2px 0 rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.25); }
.btn.primary { box-shadow: inset 0 -3px 0 rgba(0,0,0,.28), 0 2px 4px rgba(0,0,0,.3); }
.fact { border-left-width: 4px; }
.fact .src .site { font-variant: small-caps; letter-spacing: .03em; }
.toast { box-shadow: 0 4px 14px rgba(0,0,0,.35); border-radius: 10px; }
.prompt { box-shadow: 0 4px 14px rgba(0,0,0,.35); }

/* toasts sit in a lane above the hotbar, clear of the player; numbers line up */
.toasts { top: auto; bottom: 124px; flex-direction: column-reverse; }
#hud, .hotbar, .h-money, .h-energy, .slot .n, .price { font-variant-numeric: lining-nums tabular-nums; }
.h-date, .h-row, .h-quest { font-variant-numeric: lining-nums; }
.fact .src { font-size: 0.86rem; }
.small { font-size: 0.9rem; }
.pad { transition: opacity .3s; }
#touch:not(:focus-within) .pad:not(:active) { opacity: .6; }
@media (max-width: 699px) {
  .toasts { top: auto; bottom: 236px; }
  .h-date { white-space: nowrap; font-size: 0.78rem; }
  .h-row { white-space: nowrap; }
  .hud-l .h-row { gap: 4px; }
  .h-stats .h-money { white-space: nowrap; }
}
@media (max-width: 699px) {
  /* keep the date, money and buttons on one row in every era's typeface */
  .hud-l { padding: 3px 7px; }
  .h-date { font-size: 0.74rem; }
  .h-row { font-size: 0.78rem; }
  .h-stats { padding: 3px 7px; }
  .h-money { font-size: 0.86rem; }
  .h-energy { font-size: 0.72rem; gap: 4px; }
  .h-energy .bar { min-width: 30px; width: 30px; }
}

/* painted seed icons: the packet with the crop on its corner */
.ic-seed { position: relative; display: inline-block; width: 40px; height: 40px; flex: none; }
.ic-seed img { width: 100%; height: 100%; display: block; }
.ic-seed .ic-crop { position: absolute; width: 62%; height: 62%; right: -6%; bottom: -6%; }
.slot .ic-seed { width: 40px; height: 40px; pointer-events: none; }
.slot .ic-seed img { width: 100%; height: 100%; }
@media (max-width: 699px) { .slot .ic-seed { width: 34px; height: 34px; } }
.li .ic-seed { width: 36px; height: 36px; }
.li .ic-seed img { width: 100%; height: 100%; }
.row img.big, .row .ic-seed.big { width: 40px; height: 40px; flex: none; }

/* themed toasts in the era's panel colours */
.toast { background: var(--ui-bg); color: var(--ui-fg); border: 2px solid var(--ui-border); border-left-width: 6px; font-family: var(--ui-font); }
.toast.good { border-left-color: #4caf50; } .toast.quest { border-left-color: var(--ui-accent); } .toast.warn { border-left-color: #e0a030; }
.pad { opacity: .5; } .pad:active { opacity: 1; }
.h-date, .h-money, .h-row { font-family: var(--ui-font); font-variant-numeric: lining-nums tabular-nums; }
.h-date { font-weight: 700; }
@media (max-width: 699px) { .toasts { bottom: 272px; } }

/* Phones at large text (125% and up): the HUD's chips keep to one row above the goals. The date chip and the stats
   chip are capped in px (the rest of the UI still scales), and the weather keeps its icon but drops the word. */
@media (max-width: 699px) {
  .text-l .hud-l { padding: 3px 6px; }
  .text-l .h-date { font-size: 13px; }
  .text-l .h-row { font-size: 13px; gap: 3px; }
  .text-l .h-wx .wx-w { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .text-l .h-stats { padding: 3px 6px; }
  .text-l .h-money { font-size: 15px; }
  .text-l .h-energy { font-size: 12px; }
}

</style>
</head>

<script>const FACTS = {"note":"Every fact card the game displays. corpus = the quoted strings must appear in the named research file (research/garvan-*.md), which lists the sources. Verified by tools/check-facts.mjs.","facts":[{"id":"g-acres","corpus":{"file":"research/garvan-layout.md","contains":["210-acre woodland botanical garden","4.5 miles of shoreline"]},"text":"Garvan Woodland Gardens is a 210-acre woodland botanical garden on a forested peninsula in Lake Hamilton, with about 4.5 miles of shoreline.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"g-university","corpus":{"file":"research/garvan-layout.md","contains":["owned by the University of Arkansas","Fay Jones School of Architecture and Design"]},"text":"The garden is owned by the University of Arkansas and run through its Fay Jones School of Architecture and Design.","source":"Encyclopedia of Arkansas: Garvan Woodland Gardens","sourceUrl":"https://encyclopediaofarkansas.net/entries/garvan-woodland-gardens-4197/"},{"id":"g-44acres","corpus":{"file":"research/garvan-layout.md","contains":["About 44 acres are the developed tour area"]},"text":"About 44 acres are the developed tour area; the rest of the peninsula is pine, oak and hickory woodland.","source":"Encyclopedia of Arkansas: Garvan Woodland Gardens","sourceUrl":"https://encyclopediaofarkansas.net/entries/garvan-woodland-gardens-4197/"},{"id":"g-verna-1956","corpus":{"file":"research/garvan-layout.md","contains":["began the garden in 1956","laid out the paths and chose the plants herself"]},"text":"Verna Cook Garvan began the garden in 1956. Self-taught, she laid out the paths and chose the plants herself over about 40 years.","source":"Encyclopedia of Arkansas: Garvan Woodland Gardens","sourceUrl":"https://encyclopediaofarkansas.net/entries/garvan-woodland-gardens-4197/"},{"id":"g-cook-timber","corpus":{"file":"research/garvan-layout.md","contains":["Arthur B. Cook of Malvern bought it for timber","made the land a peninsula"]},"text":"In the 1920s Arthur B. Cook of Malvern bought the land for timber. Carpenter Dam then created Lake Hamilton, which made it a peninsula.","source":"Encyclopedia of Arkansas: Garvan Woodland Gardens","sourceUrl":"https://encyclopediaofarkansas.net/entries/garvan-woodland-gardens-4197/"},{"id":"g-trust-1985","corpus":{"file":"research/garvan-layout.md","contains":["In 1985 she signed a trust agreement","She died in 1993"]},"text":"In 1985 Verna Garvan signed a trust agreement giving the property to the University of Arkansas landscape architecture program. She died in 1993.","source":"Encyclopedia of Arkansas: Garvan Woodland Gardens","sourceUrl":"https://encyclopediaofarkansas.net/entries/garvan-woodland-gardens-4197/"},{"id":"g-opened-2002","corpus":{"file":"research/garvan-layout.md","contains":["renamed Garvan Woodland Gardens","dedicated on April 7, 2002"]},"text":"Building the public garden began in March 2000, when it was renamed Garvan Woodland Gardens. It was dedicated on April 7, 2002.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"g-visitors","corpus":{"file":"research/garvan-layout.md","contains":["More than 125,000 visitors come each year"]},"text":"More than 125,000 visitors come to the garden each year.","source":"Encyclopedia of Arkansas: Garvan Woodland Gardens","sourceUrl":"https://encyclopediaofarkansas.net/entries/garvan-woodland-gardens-4197/"},{"id":"g-chapel","corpus":{"file":"research/garvan-layout.md","contains":["Opened in September 2006, designed by Maurice Jennings and David McKee","57-foot ceiling"]},"text":"Anthony Chapel opened in September 2006. Designed by Maurice Jennings and David McKee, it is wood, glass and steel with yellow-pine beams and a 57-foot ceiling.","source":"Garvan Woodland Gardens: Anthony Chapel","sourceUrl":"https://www.garvangardens.org/weddings/anthony-chapel/"},{"id":"g-carillon","corpus":{"file":"research/garvan-layout.md","contains":["Anthony Family Carillon is a bell tower of 16 copper-clad"]},"text":"The Anthony Family Carillon beside the chapel is a bell tower of 16 copper-clad columns.","source":"Garvan Woodland Gardens: Anthony Chapel","sourceUrl":"https://www.garvangardens.org/weddings/anthony-chapel/"},{"id":"g-pavilion","corpus":{"file":"research/garvan-layout.md","contains":["By E. Fay Jones and Maurice Jennings","oculus shaped like an unfolding flower"]},"text":"The Verna C. Garvan Pavilion, by E. Fay Jones and Maurice Jennings, is open-air sandstone and redwood under a glass roof with an oculus shaped like an unfolding flower.","source":"Garvan Woodland Gardens: Garvan Pavilion and Terrace","sourceUrl":"https://www.garvangardens.org/weddings/garvan-pavilion-and-terrace/"},{"id":"g-pinewind","corpus":{"file":"research/garvan-layout.md","contains":["about 4 acres in a natural ravine","12-foot waterfall and a half-acre koi pond"]},"text":"The Garden of the Pine Wind is a Japanese garden of about 4 acres in a natural ravine, with cascades, pools, a 12-foot waterfall and a half-acre koi pond.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"g-fullmoon","corpus":{"file":"research/garvan-layout.md","contains":["Bridge of the Full Moon (stone, 11 feet high, with a circular"]},"text":"The Joy Manning Scott Bridge of the Full Moon is a stone bridge 11 feet high with a circular opening.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"g-sunrise","corpus":{"file":"research/garvan-layout.md","contains":["named by the mayor of Hanamaki, Japan, Hot Springs' sister city"]},"text":"The Sunrise Bridge was named by the mayor of Hanamaki, Japan, Hot Springs' sister city.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"g-cloud","corpus":{"file":"research/garvan-layout.md","contains":["white azaleas are clipped to look like clouds"]},"text":"At the Floating Cloud Bridge, white azaleas are clipped to look like clouds.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"g-bonsai","corpus":{"file":"research/garvan-layout.md","contains":["nearly three dozen bonsai and penjing"]},"text":"The Weyerhaeuser Bonsai Garden by the entrance shows nearly three dozen bonsai and penjing.","source":"Stephen Travels: Garvan Woodland Gardens","sourceUrl":"https://stephentravels.com/the-great-outdoors/garvan-woodland-gardens/"},{"id":"g-canopy","corpus":{"file":"research/garvan-layout.md","contains":["120-foot winding walkway on stone piers about two stories up"]},"text":"The Millsap Canopy Bridge is a 120-foot winding walkway on stone piers about two stories up, over Singing Springs Gorge.","source":"Stephen Travels: Garvan Woodland Gardens","sourceUrl":"https://stephentravels.com/the-great-outdoors/garvan-woodland-gardens/"},{"id":"g-children","corpus":{"file":"research/garvan-layout.md","contains":["cave behind a 12-foot waterfall","450-foot elevated walkway"]},"text":"The Evans Children's Adventure Garden has a cave behind a 12-foot waterfall, a rock maze, wading pools and a 450-foot elevated walkway.","source":"Stephen Travels: Garvan Woodland Gardens","sourceUrl":"https://stephentravels.com/the-great-outdoors/garvan-woodland-gardens/"},{"id":"g-treehouse","corpus":{"file":"research/garvan-layout.md","contains":["By Modus Studio of Fayetteville","June 30, 2018"]},"text":"The Bob and Sunny Evans Tree House, by Modus Studio of Fayetteville in steel and heat-treated pine, opened June 30, 2018.","source":"Dezeen: Garvan Woodland Gardens treehouse","sourceUrl":"https://www.dezeen.com/?p=1402721"},{"id":"g-hixson","corpus":{"file":"research/garvan-layout.md","contains":["45 acres of dense forest on the north side","Birdsong Trail"]},"text":"The Hixson Family Nature Preserve is 45 acres of dense forest on the north side, with the Birdsong Trail and bird feeding stations.","source":"TravelAwaits: Garvan Woodland Gardens","sourceUrl":"https://www.travelawaits.com/2562287/garvan-woodland-gardens/"},{"id":"g-perry","corpus":{"file":"research/garvan-layout.md","contains":["The westernmost point: a flagstone terrace over Lake Hamilton"]},"text":"The Perry Wildflower Overlook is the westernmost point: a flagstone terrace over Lake Hamilton beside a wildflower meadow.","source":"Garvan Woodland Gardens: Perry Wildflower Overlook","sourceUrl":"https://www.garvangardens.org/weddings/perry-wildflower-overlook/"},{"id":"g-train","corpus":{"file":"research/garvan-layout.md","contains":["G-scale trains on 389 feet of track","Malvern Brick & Tile"]},"text":"The Sugg Model Train Garden runs G-scale trains on 389 feet of track, past miniatures of Malvern Brick & Tile and the Cook family's lumber mill.","source":"TravelAwaits: Garvan Woodland Gardens","sourceUrl":"https://www.travelawaits.com/2562287/garvan-woodland-gardens/"},{"id":"g-klipsch","corpus":{"file":"research/garvan-layout.md","contains":["flagstone seating for 500"]},"text":"The Klipsch Amphitheater sits in a natural hollow in the middle of the gardens, with flagstone seating for 500 under tall pines.","source":"Garvan Woodland Gardens amphitheater RFQ (2012)","sourceUrl":"https://www.publicgardens.org/wp-content/uploads/2015/11/Garvan-Woodland-Gardens_RFP.pdf"},{"id":"g-welcome","corpus":{"file":"research/garvan-layout.md","contains":["Wood and native stone, designed by French Harris of Hot Springs"]},"text":"The Pratt Welcome Center, in wood and native stone, was designed by French Harris of Hot Springs. It holds the gate, the GardenShop and the Magnolia Room.","source":"Encyclopedia of Arkansas: Garvan Woodland Gardens","sourceUrl":"https://encyclopediaofarkansas.net/entries/garvan-woodland-gardens-4197/"},{"id":"g-azaleas","corpus":{"file":"research/garvan-layout.md","contains":["More than 160 varieties of azaleas"]},"text":"The garden grows more than 160 varieties of azaleas.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"g-camellias","corpus":{"file":"research/garvan-layout.md","contains":["about 100 plants of 50 cultivars along a quarter-mile camellia trail"]},"text":"About 100 camellias of 50 cultivars line a quarter-mile camellia trail; Garvan is on the American Camellia Trail.","source":"American Camellia Society: Garvan Woodland Gardens","sourceUrl":"https://americancamellias.com/gardens-nurseries/american-camellia-trail-gardens/camellia-trail-gardens-by-state/arkansas/garvan-woodland-gardens"},{"id":"g-george","corpus":{"file":"research/garvan-layout.md","contains":["George can be","usually near the Pratt Welcome Center"]},"text":"A peacock named George roams the grounds, usually near the Pratt Welcome Center.","source":"Arkansas Tourism: Birding at Garvan Woodland Gardens","sourceUrl":"https://www.arkansas.com/articles/birding-garvan-woodland-gardens"},{"id":"g-dogs","corpus":{"file":"research/garvan-layout.md","contains":["Dogs are welcome on a leash of 6 feet or less"]},"text":"Dogs are welcome on a leash of 6 feet or less, but not in the chapel, the treehouse, the ponds or during Holiday Lights.","source":"Garvan Woodland Gardens: Admission","sourceUrl":"https://www.garvangardens.org/?p=8"},{"id":"g-tulips","corpus":{"file":"research/garvan-operations.md","contains":["About 150,000 tulips of about 150 varieties","hand-planted in designed shapes marked out with string"]},"text":"The Tulip Extravaganza shows about 150,000 tulips of about 150 varieties, hand-planted in designed shapes marked out with string lines.","source":"The Sentinel-Record (2026)","sourceUrl":"https://www.hotsr.com/news/2026/mar/09/watch-garvan-woodland-gardens-tulip-extravaganza/"},{"id":"g-tulip-annual","corpus":{"file":"research/garvan-operations.md","contains":["treated as annuals and replanted every year","USDA Zone 8"]},"text":"The tulips are treated as annuals and replanted every year: Hot Springs is now USDA Zone 8, too warm for most tulips to come back.","source":"The Sentinel-Record (2024)","sourceUrl":"https://www.hotsr.com/news/2024/mar/21/watch-garvan-woodland-gardens-annual-tulip/"},{"id":"g-tulip-january","corpus":{"file":"research/garvan-operations.md","contains":["moved planting later, into January","150,000 tulips in 10 days"]},"text":"Staff moved tulip planting later, into January, so tulips would not bloom while the garden is closed. For the 2026 show the crew planted 150,000 tulips in 10 days.","source":"The Sentinel-Record","sourceUrl":"https://www.hotsr.com/news/2026/mar/09/watch-garvan-woodland-gardens-tulip-extravaganza/"},{"id":"g-tulip-freeze","corpus":{"file":"research/garvan-operations.md","contains":["sustained hard freeze in the mid-20s"]},"text":"Brief dips below freezing are fine for tulips, but a sustained hard freeze in the mid-20s °F damages the blooms.","source":"The Sentinel-Record (2024)","sourceUrl":"https://www.hotsr.com/news/2024/mar/21/watch-garvan-woodland-gardens-annual-tulip/"},{"id":"g-closed-january","corpus":{"file":"research/garvan-operations.md","contains":["closed for all of January and reopens about February 1"]},"text":"The garden closes for all of January and reopens about February 1.","source":"Garvan Woodland Gardens","sourceUrl":"https://www.garvangardens.org/"},{"id":"g-daffodils","corpus":{"file":"research/garvan-operations.md","contains":["tens of thousands of daffodils bloom first"]},"text":"Daffodil Days open the season: crocus, hyacinths and tens of thousands of daffodils bloom first after the garden reopens.","source":"University of Arkansas News","sourceUrl":"https://news.uark.edu/articles/20087/garvan-woodland-gardens-reopens-in-february-with-daffodil-days-celebration"},{"id":"g-fall-woodlands","corpus":{"file":"research/garvan-operations.md","contains":["Japanese maples, chrysanthemums and fall annuals","more than 8,000 mums"]},"text":"Fall in the Woodlands brings Japanese maples, chrysanthemums and fall annuals; past displays used more than 8,000 mums.","source":"University of Arkansas News","sourceUrl":"https://news.uark.edu/articles/22084/fall-heralded-with-chrysanthemum-blooms-at-garvan-woodland-gardens"},{"id":"g-trashbash","corpus":{"file":"research/garvan-operations.md","contains":["Lake Hamilton shoreline, road and ditch cleanup"]},"text":"Trash Bash is an annual Lake Hamilton shoreline, road and ditch cleanup each fall.","source":"University of Arkansas News","sourceUrl":"https://news.uark.edu/articles/39739/garvan-woodland-gardens-hosts-trash-bash-fall-festival-and-workshops-in-october"},{"id":"g-lights","corpus":{"file":"research/garvan-operations.md","contains":["November 21 to December 31","about 5 to 9:30 PM"]},"text":"Holiday Lights runs at night, about 5 to 9:30 PM; in 2026 from November 21 to December 31.","source":"Garvan Woodland Gardens: Holiday Lights","sourceUrl":"https://www.garvangardens.org/holiday-lights"},{"id":"g-rosetree","corpus":{"file":"research/garvan-operations.md","contains":["roughly 50-foot tree with a 12 to 15 minute musical light show"]},"text":"The Rose Tree is a roughly 50-foot tree with a 12 to 15 minute musical light show.","source":"KARK (2023)","sourceUrl":"https://digital-release.kark.com/?p=1609266"},{"id":"g-lights-contract","corpus":{"file":"research/garvan-operations.md","contains":["installation begins around September 15","about 150 pole trees, about 60 wrapped trees"]},"text":"A 2026 university contract has Holiday Lights installation begin around September 15, with about 150 pole trees, 60 wrapped trees and 300 set pieces over about 20 acres.","source":"University of Arkansas bid IFB05142026","sourceUrl":"https://app.govly.com/public/awards/5f97e28df8b088029ffefb4a929c2e47"},{"id":"g-46weeks","corpus":{"file":"research/garvan-operations.md","contains":["about 46 weeks of work a year","Volunteers cannot operate machinery"]},"text":"Holiday Lights takes about 46 weeks of work a year. Some elements weigh over 300 pounds, and volunteers cannot operate machinery.","source":"The Sentinel-Record (2024)","sourceUrl":"https://www.hotsr.com/news/2024/sep/15/watch-all-hands-on-deck-garden-seeks-volunteers/"},{"id":"g-weddings","corpus":{"file":"research/garvan-operations.md","contains":["about 200 weddings a year"]},"text":"The garden hosts about 200 weddings a year.","source":"University of Arkansas News","sourceUrl":"https://news.uark.edu/articles/21249/anthony-chapel-at-garvan-woodland-gardens-named-one-of-the-coolest-places-to-get-married-"},{"id":"g-storm-2012","corpus":{"file":"research/garvan-operations.md","contains":["In 2012 the garden closed for the rest of the year after a winter storm"]},"text":"In 2012 the garden closed for the rest of the year after a winter storm and power outages.","source":"KATV","sourceUrl":"https://katv.com/archive/garvan-woodland-gardens-closed-the-rest-of-2012"}]};</script>

// ---------- build ----------
function buildWorld(seed) {
  const g = new Uint8Array(W * H);
  const lake = new Uint8Array(W * H);
  const zone = new Uint8Array(W * H);
  const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
  const set = (x, y, v) => { if (inb(x, y)) g[y * W + x] = v; };
  const get = (x, y) => (inb(x, y) ? g[y * W + x] : G.DEEP);
  const zoneId = (x, y) => ZONES[zone[y * W + x]].id;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let zi = ZONES.length - 1;
    for (let i = 0; i < ZONES.length; i++) { const r = ZONES[i].r; if (x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]) { zi = i; break; } }
    zone[y * W + x] = zi;
    if (!landAt(x, y)) { lake[y * W + x] = 1; set(x, y, G.WATER); }
    else set(x, y, DEVELOPED.has(ZONES[zi].id) ? G.GRASS : G.FOREST);
  }
  // Deep water away from the shore; a sandy and rocky margin where land meets the lake.
  const near = (x, y, r, f) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (f(x + i, y + j)) return true; return false; };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = y * W + x;
    if (lake[k] && !near(x, y, 4, (a, b) => inb(a, b) && !lake[b * W + a])) g[k] = G.DEEP;
    else if (!lake[k] && near(x, y, 1, (a, b) => inb(a, b) && lake[b * W + a])) g[k] = (hash(x, y, 'shore') % 7 === 0) ? G.ROCK : G.SAND;
  }
  const fill = (x0, y0, x1, y1, v, only) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (!only || only(get(x, y))) set(x, y, v); };
  const onLand = (v) => v !== G.WATER && v !== G.DEEP;
  const line = (pts, width, v, opt = {}) => {
    const o0 = width === 1 ? 0 : width === 3 ? -1 : 0, o1 = width === 1 ? 0 : width === 3 ? 1 : width - 1;
    for (let i = 0; i + 1 < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) * 4));
      for (let s = 0; s <= n; s++) {
        const px = Math.floor(ax + (bx - ax) * s / n), py = Math.floor(ay + (by - ay) * s / n);
        for (let dy = o0; dy <= o1; dy++) for (let dx = o0; dx <= o1; dx++) {
          const x = px + dx, y = py + dy, cur = get(x, y);
          if (opt.keep && opt.keep(cur)) continue;
          if ((cur === G.BRIDGE || cur === G.BOARDWALK) && v !== G.BOARDWALK) continue; // a later stroke never paves over a bridge
          if (!onLand(cur) && !opt.water) continue;

  fill(58, 38, 68, 47, G.LAWN, onLand);              // Ellen Edmondson Great Lawn
  fill(70, 63, 76, 68, G.LAWN, onLand);              // Koi Pond Meadow
  fill(84, 48, 97, 51, G.STONE, onLand);             // Welcome Center plaza
  fill(70, 43, 77, 45, G.STONE, onLand);             // Pavilion terrace
  fill(9, 41, 15, 47, G.STONE, onLand);              // Perry Overlook flagstone terrace
  for (let y = 37; y <= 45; y++) for (let x = 48; x <= 56; x++) { // Klipsch Amphitheater: flagstone rows in a hollow
    if (Math.hypot((x - 52) * 0.8, y - 44) > 7.5) continue;
    set(x, y, y % 2 ? G.STONE : G.GRASS);
  }
  { const cx = 100, cy = 32; for (let y = cy - 4; y <= cy + 4; y++) for (let x = cx - 4; x <= cx + 4; x++) { const d = Math.hypot(x - cx, y - cy); if (d <= 3.4) set(x, y, d <= 1.8 ? G.LAWN : G.LAWN); } } // Celebration Garden lawn
  fill(96, 42, 114, 56, G.PARKING, onLand);
  fill(102, 59, 117, 74, G.GRAVEL, onLand);          // maintenance yard
  // Beds.
  const beds = [];
  for (const b of TULIP_BEDS) {
    const tiles = [];
    if (b.ring) { const [cx, cy, r0, r1] = b.ring; for (let y = cy - 4; y <= cy + 4; y++) for (let x = cx - 4; x <= cx + 4; x++) { const d = Math.hypot(x - cx, y - cy); if (d >= r0 && d <= r1) tiles.push([x, y]); } }
    else { const [x0, y0, x1, y1] = b.r; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) tiles.push([x, y]); }
    beds.push({ ...b, tiles });
    for (const [x, y] of tiles) if (onLand(get(x, y))) set(x, y, G.BED);
  }
  for (const [x0, y0, x1, y1] of SHRUB_BEDS) fill(x0, y0, x1, y1, G.BED, onLand);
  // Streams, pond, gorge.
  const SPR = new Set();
  line(PINE_CASCADE, 1, G.STREAM); line(PINE_STREAM, 1, G.STREAM); line(PINE_OUTLET, 1, G.STREAM); line(KIDS_RUN, 1, G.STREAM);
  for (let y = 58; y <= 70; y++) for (let x = 60; x <= 73; x++) if (((x + 0.5 - POND.cx) / POND.rx) ** 2 + ((y + 0.5 - POND.cy) / POND.ry) ** 2 <= 1) set(x, y, G.POND);
  for (let y = 13; y <= 37; y++) for (let x = 41; x <= 49; x++) if (Math.abs(x - (44.6 + (37 - y) * -0.04)) <= 2.2 && onLand(get(x, y))) set(x, y, G.GORGE);

  for (const [x, y] of [[60, 26], [61, 27], [62, 30]]) { set(x, y, G.POND); SPR.add(x + ',' + y); } // wading pools
  // Paths (bridges where they cross water).

  line([[41, 30], [51, 30]], 2, G.BOARDWALK, { bridge: G.BOARDWALK });  // Millsap Canopy Bridge
  line(SHORT, 2, G.PATH, { bridge: G.BRIDGE, keep: (v) => v === G.STONE || v === G.PARKING || v === G.LAWN });
  line(CHAPEL_WALK, 2, G.STONE); line(CELEBRATION_WALK, 1, G.STONE);
  line(AMPHI_WALK, 2, G.STONE, { keep: (v) => v === G.LAWN });
  line(TREEHOUSE_WALK, 2, G.PATH, { bridge: G.BRIDGE });
  line(KOI_WALK, 2, G.PATH, { bridge: G.BRIDGE, keep: (v) => v === G.LAWN });
  line(BIRDSONG, 1, G.PATH, { bridge: G.BRIDGE });
  line(SHORE_TRAIL, 1, G.PATH, { bridge: G.BRIDGE });
  line(CAMELLIA_TRAIL, 1, G.PATH, { bridge: G.BRIDGE });
  line(SERVICE, 2, G.GRAVEL); line(SERVICE_WEST, 2, G.GRAVEL, { bridge: G.BRIDGE, keep: (v) => v === G.STONE || v === G.PATH });
  line(ROAD_IN, 2, G.ROAD);
  // Model-train track: a G-scale loop in the train garden behind the Welcome Center.
  for (let y = 32; y <= 36; y++) for (let x = 77; x <= 83; x++) if ((y === 32 || y === 36 || x === 77 || x === 83) && onLand(get(x, y))) set(x, y, G.RAIL);
  // Boulders in the Japanese garden ravine and along the gorge rim.
  const r0 = stream(seed, 'boulders');
  for (let i = 0; i < 26; i++) { const x = 60 + Math.floor(rnd(r0) * 20), y = 55 + Math.floor(rnd(r0) * 16); if (get(x, y) === G.GRASS) set(x, y, G.ROCK); }

  // Buildings.
  const buildings = [];
  const places = {};
  for (const [type, id, label, x, y, w, h, place] of BUILDINGS) {
    const door = { x: x + Math.floor(w / 2), y: y + h - 1 };
    const b = { type, id, label, x, y, w, h, door, front: { x: door.x, y: door.y + 1 }, place };
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (get(xx, yy) === G.WATER || get(xx, yy) === G.DEEP) set(xx, yy, G.GRASS);
    const f = b.front; if (!isPaved(get(f.x, f.y))) set(f.x, f.y, G.STONE);
    buildings.push(b);
    if (place) places[place] = { ...b.front };
  }
  // Named standing points (staff schedules, visitors, tests).
  Object.assign(places, {
    welcomeFront: { x: 89, y: 49 }, cafeFront: { x: 86, y: 41 }, pavilionFront: { x: 74, y: 44 }, lawnEast: { x: 69, y: 44 },
    pinewindPath: { x: 72, y: 58 }, childrenPath: { x: 59, y: 30 }, trainYard: { x: 80, y: 38 }, perry: { x: 13, y: 44 },
    gate: { x: 84, y: 50 }, start: { x: 107, y: 67 }, staffLot: { x: 116, y: 76 }, koi: { x: 74, y: 65 }, canopy: { x: 46, y: 30 },
    amphitheater: { x: 53, y: 43 }, southern: { x: 52, y: 59 }, hixson: { x: 68, y: 13 }, chapel: { x: 106, y: 37 },
  });
  for (const p of Object.values(places)) if (groundBlocks(get(p.x, p.y))) set(p.x, p.y, G.PATH);
  const bmask = new Set();
  const taken = new Set();
  for (const p of Object.values(places)) { taken.add(p.x + ',' + p.y); taken.add(p.x + ',' + (p.y - 1)); }
  for (const b of buildings) for (let yy = b.y - 1; yy <= b.y + b.h; yy++) for (let xx = b.x - 1; xx <= b.x + b.w; xx++) bmask.add(xx + ',' + yy);
  const freeAt = (x, y, ok) => !bmask.has(x + ',' + y) && !taken.has(x + ',' + y) && ok(get(x, y));
  const nudge = (x, y, ok) => { for (let r = 0; r < 5; r++) for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (freeAt(x + i, y + j, ok)) return [x + i, y + j]; return [x, y]; };

  for (const [k, x, y] of [['welcome', 95, 52], ['chapel', 108, 39], ['pavilion', 69, 42], ['pinewind', 79, 58], ['bonsai', 85, 53], ['canopy', 52, 32],
    ['children', 57, 32], ['hixson', 61, 22], ['perry', 16, 43], ['train', 84, 33], ['klipsch', 57, 42], ['history', 98, 51]]) addFixed({ t: 'sign', k, x, y });
  for (const [x, y] of [[63, 17], [71, 11], [77, 16], [66, 23]]) addFixed({ t: 'feeder', x, y });
  addFixed({ t: 'venue', k: 'chapel', x: 104, y: 37 }, (v) => soft(v) || v === G.STONE);
  addFixed({ t: 'venue', k: 'pergola', x: 80, y: 45 }, (v) => soft(v) || v === G.BED);
  addFixed({ t: 'venue', k: 'koi', x: 75, y: 66 });
  addFixed({ t: 'pergola', x: 81, y: 45 }, (v) => soft(v) || v === G.BED);

  return { W, H, g, lake, zone, buildings, places, fixed, lamps, markers, wraps, beds, routes, special: {}, pools: SPR, zoneId };
}

// ---------- plantings ----------
// The permanent plants and the woods, placed once for a new game from a seeded stream. Objects:
// { t: 'plant', k: plant id, c: colour index, hp: health 0-100 } and { t: 'tree', k } (trees are plants too, but
// drawn by the tree renderer). Rocks are boulders.
const ZONE_MIX = {
  welcome: ['azalea', 'camellia', 'azalea', 'rose', 'daffodil'], cafe: ['hydrangea', 'daylily', 'azalea', 'daffodil'],
  pinewind: ['azalea', 'azalea', 'peony', 'fern', 'camellia', 'fern'], southern: ['rose', 'daylily', 'hydrangea', 'camellia', 'azalea'],
  canopy: ['hydrangea', 'fern', 'rhododendron', 'fern', 'hydrangea'], children: ['fern', 'azalea', 'daylily', 'fern'],
  lawn: ['azalea', 'daffodil', 'conifer'], pavilion: ['rose', 'daylily', 'hydrangea', 'azalea'], chapel: ['azalea', 'camellia', 'hydrangea', 'daffodil'],
  perry: ['wildflower', 'wildflower', 'wildflower'], parking: ['azalea', 'daylily'],
};
const ZONE_TREES = {
  welcome: ['magnolia', 'dogwood', 'pine'], cafe: ['oak', 'dogwood', 'pine'], pinewind: ['jmaple', 'jmaple', 'pine', 'jmaple', 'dogwood'],
  southern: ['magnolia', 'dogwood', 'redbud'], canopy: ['pine', 'oak', 'hickory', 'dogwood'], children: ['oak', 'pine', 'dogwood'],
  lawn: ['dogwood', 'redbud', 'magnolia', 'oak'], pavilion: ['magnolia', 'dogwood'], chapel: ['pine', 'pine', 'oak', 'dogwood'],
  perry: ['pine', 'oak'], parking: ['oak', 'pine'], yard: ['pine'], hixson: ['oak', 'pine', 'hickory', 'pine'], woods: ['pine', 'oak', 'pine', 'hickory'],
};
function gardenPlantings(world, seed) {
  const r = stream(seed, 'plantings');
  const objs = {};
  const { g } = world;
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? G.DEEP : g[y * W + x]);
  const occupied = new Set();
  for (const b of world.buildings) for (let y = b.y - 1; y <= b.y + b.h; y++) for (let x = b.x - 1; x <= b.x + b.w; x++) occupied.add(x + ',' + y);
  for (const f of world.fixed) occupied.add(f.x + ',' + f.y);
  for (const m of world.markers) if (!m.wrap) occupied.add(m.x + ',' + m.y);
  for (const p of Object.values(world.places)) { occupied.add(p.x + ',' + p.y); occupied.add(p.x + ',' + (p.y - 1)); }
  const tulipTiles = new Set(world.beds.flatMap((b) => b.tiles.map(([x, y]) => x + ',' + y)));
  const nearPaved = (x, y, d) => { for (let j = -d; j <= d; j++) for (let i = -d; i <= d; i++) { const v = at(x + i, y + j); if (v === G.PATH || v === G.STONE || v === G.BRIDGE || v === G.BOARDWALK) return true; } return false; };
  const touchesWalk = (x, y) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([i, j]) => { const v = at(x + i, y + j); return v === G.PATH || v === G.STONE || v === G.BRIDGE || v === G.BOARDWALK || v === G.PARKING; });
  const put = (x, y, o) => { const k = x + ',' + y; if (occupied.has(k) || objs[k]) return false; objs[k] = o; return true; };
  const plant = (k) => ({ t: 'plant', k, c: Math.floor(rnd(r) * 4), hp: 80 + Math.floor(rnd(r) * 20) });
  const tree = (k) => ({ t: 'tree', k, hp: 100 });
  // Wrapped trees for Holiday Lights.
  for (const w of world.wraps) objs[w.x + ',' + w.y] = tree(pick(r, ['oak', 'dogwood', 'magnolia']));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = at(x, y), k = x + ',' + y;
    if (occupied.has(k) || objs[k] || tulipTiles.has(k)) continue;
    const zid = world.zoneId(x, y);
    if (v === G.FOREST) {
      const n = rnd(r);
      const shore = zid === 'hixson' && [[0, -2], [0, -3], [-2, 0], [2, 0]].some(([i, j]) => at(x + i, y + j) === G.SAND || at(x + i, y + j) === G.WATER);

// ---------- creation ----------
function newGame(opts = {}) {
  const seed = (opts.seed ?? 1) >>> 0;
  const S = {
    v: VERSION, seed, day: opts.day ?? 0, time: D.DAY_START, tick: 0, weather: 'clear', freezeTonight: false,
    money: opts.money ?? 40, earned: 0, energy: D.MAX_ENERGY, maxEnergy: D.MAX_ENERGY, rs: hash(seed, 'run') | 0, crs: { rs: hash(seed, 'crowd') | 0 },
    player: { x: 0, y: 0, face: 'down', moving: false, walk: 0, hat: 'cap', hatColor: '#3a6a3a' }, sel: 0, inv: new Array(C.INV_SIZE).fill(null), can: D.CAN_CAP[1], tier: 1,
    objs: {}, weeds: {}, leaves: {}, litter: {}, grass: {}, mulch: {}, beds: {}, covered: {}, watered: {},
    disp: {}, orders: [], daystats: {}, rate: { sum: 0, n: 0 }, rateBonus: 0, ratingHist: [], rating: 3,
    visitors: [], vseq: 0, peafowl: [], peafowlInBeds: {}, attend: 0, wedding: null, feedersDay: -99, fairy: null,
    npcs: {}, almanac: [], flags: {}, stats: { litter: 0, limbs: 0, bulbs: 0, orders: 0, visitors: 0 }, ys: null, yearsDone: [],
    summary: null, passOut: false, autoPath: null,
  };
  const gm = { S, world: null, nav: makeNav(), navVersion: 0, events: [] };
  rebuildWorld(gm);
  S.objs = gardenPlantings(gm.world, seed);
  indexObjs(gm);
  startingGarden(gm);
  S.ys = newYearStats();
  for (const [id, p] of Object.entries(D.PEOPLE)) {
    const at = placeOf(gm, p.sched[0][1]);
    S.npcs[id] = { pts: 0, talkDay: -1, giftDay: -1, x: at.x + 0.5, y: at.y + 0.9, path: null, place: p.sched[0][1], hidden: true, face: 'down' };
  }
  S.peafowl = crowd.newPeafowl(gm);
  for (const t of D.TOOLS) addItem(S, t, 1);
  addItem(S, 'straw', 6);
  toStart(gm);
  startDay(gm, true);
  return gm;
}
// The garden as you find it on your first spring morning: tulips up in the display beds (planted by last year's
// crew), beds mulched at various times, a little of everything to do.
function startingGarden(gm) {
  const S = gm.S, r = stream(S.seed, 'start');
  for (const bed of gm.world.beds) for (const [x, y] of bed.tiles) {
    const k = key(x, y);
    if (ground(gm, x, y) !== G.BED) continue;
    if (S.day % D.YEAR_DAYS < D.yd('sp', 14)) S.beds[k] = { p: 'tulip', c: tulipDesignFor(gm, bed, x, y, 0), ok: true };
  }
  for (const k of gm.bedTiles) S.mulch[k] = -Math.floor(rnd(r) * 70);
  for (const k of gm.lawnTiles) if (rnd(r) < 0.4) S.grass[k] = 1;
  for (const k of gm.bedTiles) if (rnd(r) < 0.06) S.weeds[k] = 1;
}
const tulipDesignFor = (gm, bed, x, y, year) => WORLD.tulipDesign(bed, x, y, year);

function attach(S) {
  const gm = { S, world: null, nav: makeNav(), navVersion: 0, events: [] };
  rebuildWorld(gm);
  return gm;
}
// Derived data: the map and indexes the rules use (never saved).
function rebuildWorld(gm) {
  const w = gm.world = buildWorld(gm.S.seed);
  gm.bmap = new Int16Array(W * H).fill(-1);
  w.buildings.forEach((b, i) => { for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) gm.bmap[y * W + x] = i; });
  gm.fixed = {};
  for (const f of w.fixed) gm.fixed[key(f.x, f.y)] = f;
  gm.markerMap = {}; gm.markerById = {};
  for (const m of w.markers) { gm.markerMap[key(m.x, m.y)] = m; gm.markerById[m.id] = m; }
  gm.bedMap = {}; gm.tulipTiles = [];
  for (const b of w.beds) for (const [x, y] of b.tiles) if (w.g[y * W + x] === G.BED) { gm.bedMap[key(x, y)] = b; gm.tulipTiles.push(key(x, y)); }
  gm.bedTiles = []; gm.lawnTiles = []; gm.pondTiles = []; gm.railTiles = [];
  gm.zoneSize = new Array(ZONES.length).fill(0);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = w.g[y * W + x], k = key(x, y);
    if (v === G.BED) gm.bedTiles.push(k);
    else if (v === G.LAWN) gm.lawnTiles.push(k);
    else if (v === G.POND) gm.pondTiles.push(k);
    else if (v === G.RAIL) gm.railTiles.push(k);
    if (!groundBlocks(v)) gm.zoneSize[w.zone[y * W + x]]++;
  }
  gm.zoneIdx = ZONE_INDEX;
  gm.feeders = w.fixed.filter((f) => f.t === 'feeder');
  indexObjs(gm);
  gm.navVersion++;
  gm.zcache = null;
}
function indexObjs(gm) {
  gm.bonsai = [];
  for (const [k, o] of Object.entries(gm.S.objs || {})) if (o.t === 'plant' && o.k === 'bonsai') gm.bonsai.push(k);
}
const newYearStats = () => ({ tulipPct: null, lightsReady: false, lightsChecked: false, lightsPct: 0, weddings: 0, weddingsMissed: 0, ratingSum: 0, ratingDays: 0, orders: 0, ordersDone: 0 });
function toStart(gm) { const p = placeOf(gm, 'start'); gm.S.player.x = p.x + 0.5; gm.S.player.y = p.y + 0.9; gm.S.player.face = 'up'; }

// ---------- the tick ----------
function tick(gm, input = {}) {
  const S = gm.S;
  S.tick++;
  if (S.tick >= D.TICKS_PER_MIN) {
    S.tick = 0; S.time++;
    if (S.time >= D.DAY_END) { sleep(gm, { passOut: true }); return; }
    minute(gm);
  }
  movePlayer(gm, input);
  moveNpcs(gm);
  crowd.crowdTick(gm);
}
// Once a game minute: weddings start and end, the café closes, the lights come on.
function minute(gm) {
  const S = gm.S, w = S.wedding;
  if (w && !w.checked && S.time >= w.at) {
    w.checked = true;
    if (!w.setup) { S.ys.weddingsMissed++; S.rateBonus -= 6; toast(gm, `The wedding at ${w.name} started without its chairs. Mariana is not happy.`, 'warn'); }
    else { toast(gm, `A wedding is under way at ${w.name}. ♥`, 'good'); emit(gm, 'sound', { id: 'bells' }); }
  }
  const h = cal.hours(S);
  if (h.mode === 'lights' && S.time === h.open) toast(gm, 'The gates open for Holiday Lights.', 'good');
  if (h.mode === 'day' && S.time === h.open) toast(gm, 'The gates are open. Visitors are coming in.');
  if (h.mode !== 'closed' && S.time === h.close) toast(gm, 'The garden is closing for the day.');
}

function movePlayer(gm, input) {
  const S = gm.S, p = S.player;
  let mx = input.mx || 0, my = input.my || 0;
  if ((mx || my) && S.autoPath) S.autoPath = null;
  if (!mx && !my && S.autoPath && S.autoPath.length) {
    const n = S.autoPath[0];
    const dx = n.x + 0.5 - p.x, dy = n.y + 0.9 - p.y;
    if (Math.abs(dx) < 0.08 && Math.abs(dy) < 0.08) { S.autoPath.shift(); if (!S.autoPath.length) { S.autoPath = null; if (S.autoFace) { p.face = S.autoFace; S.autoFace = null; } } }
    else { mx = Math.abs(dx) > 0.04 ? Math.sign(dx) : 0; my = Math.abs(dy) > 0.04 ? Math.sign(dy) : 0; if (Math.abs(dx) > 0.04 && Math.abs(dy) > 0.04) my = 0; }
  }
  if (!mx && !my) { p.moving = false; return; }
  const len = Math.hypot(mx, my);
  let sp = SPEED * (S.energy <= 15 ? 0.7 : 1);
  // The utility cart (from Year 2) is quicker on paths and roads.
  const here = ground(gm, Math.floor(p.x), Math.floor(p.y - 0.1));
  if (S.tier >= 2 && (here === G.PATH || here === G.ROAD || here === G.PARKING || here === G.GRAVEL || here === G.STONE)) sp *= 1.45;
  if (S.autoPath) sp = Math.min(sp, Math.max(Math.abs((S.autoPath[0]?.x ?? 0) + 0.5 - p.x), Math.abs((S.autoPath[0]?.y ?? 0) + 0.9 - p.y), 0.02));
  const vx = mx / len * sp, vy = my / len * sp;
  if (Math.abs(mx) > Math.abs(my) + 0.01) p.face = mx > 0 ? 'right' : 'left';
  else if (my) p.face = my > 0 ? 'down' : 'up';
  else p.face = mx > 0 ? 'right' : 'left';
  const hw = 0.28, top = 0.2;
  const free = (x, y) => !blocked(gm, Math.floor(x - hw), Math.floor(y - top)) && !blocked(gm, Math.floor(x + hw), Math.floor(y - top))
    && !blocked(gm, Math.floor(x - hw), Math.floor(y - 0.01)) && !blocked(gm, Math.floor(x + hw), Math.floor(y - 0.01));
  if (free(p.x + vx, p.y)) p.x += vx;
  if (free(p.x, p.y + vy)) p.y += vy;
  p.x = Math.max(0.3, Math.min(W - 0.3, p.x)); p.y = Math.max(1.2, Math.min(H - 0.01, p.y));
  p.moving = true; p.walk = (p.walk + 1) % 10000;
}

// ---------- staff ----------
function npcPlaceNow(S, id) {
  const p = D.PEOPLE[id];
  let place = p.sched[0][1];
  for (const [t, pl] of p.sched) if (S.time >= t) place = pl;
  const h = cal.hours(S);
  if (id === 'dale' && h.mode === 'lights' && S.time >= 960 && S.time < 1320) place = 'lawnEast';
  if (id === 'tomas' && h.mode === 'closed') place = 'staffLot';
  if (id === 'opal' && h.mode !== 'day') place = h.mode === 'lights' && S.time >= 990 && S.time < 1290 ? 'welcomeFront' : 'staffLot';
  if (id === 'mariana' && S.wedding && S.time >= 600 && S.time < S.wedding.at + 120) place = S.wedding.venue + 'Venue';
  return place;
}
function spotFor(gm, id, place) {
  const base = placeOf(gm, place);
  if (place === D.PEOPLE[id].home) return base;
  const cast = Object.keys(gm.S.npcs), i = cast.indexOf(id);
  for (const dx of [[0, 1, -1][i % 3], 0]) { const x = base.x + dx; if (!blocked(gm, x, base.y)) return { x, y: base.y }; }
  return base;
}
function moveNpcs(gm) {
  const S = gm.S;
  const blk = (x, y) => blocked(gm, x, y);
  for (const [id, n] of Object.entries(S.npcs)) {
    const want = npcPlaceNow(S, id);
    if (want !== n.place || (!n.path && n.placeArrived !== want)) {
      n.place = want; n.placeArrived = null;
      const to = spotFor(gm, id, want);
      const sx = Math.floor(n.x), sy = Math.floor(n.y - 0.1);
      n.path = findPath(gm.nav, gm.navVersion, W, H, blk, sx, sy, to.x, to.y);
      n.path = n.path ? n.path.slice() : null;
      n.hidden = false;
      if (!n.path) { n.x = to.x + 0.5; n.y = to.y + 0.9; n.placeArrived = want; }
    }
    if (n.path && n.path.length) {
      const t = n.path[0];
      const dx = t.x + 0.5 - n.x, dy = t.y + 0.9 - n.y, d = Math.hypot(dx, dy);
      if (d <= NPC_SPEED) { n.x = t.x + 0.5; n.y = t.y + 0.9; n.path.shift(); }
      else { n.x += dx / d * NPC_SPEED; n.y += dy / d * NPC_SPEED; n.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
      n.moving = true;
      if (!n.path.length) { n.path = null; n.placeArrived = n.place; n.moving = false; n.face = 'down'; }
    } else n.moving = false;
    n.hidden = n.place === D.PEOPLE[id].home && !n.path;
  }
}
function npcAt(gm, x, y) {
  for (const [id, n] of Object.entries(gm.S.npcs)) {
    if (n.hidden) continue;
    if (Math.abs(n.x - (x + 0.5)) < 0.75 && Math.abs(n.y - 0.5 - (y + 0.5)) < 0.8) return id;
  }
  return null;
}

// ---------- actions ----------
const rec = (gm) => (type, zone, n) => orders.record(gm, type, zone, n);
// use(): context first (person, bird, building, fixed object), then the selected item on the target tile.
function use(gm, at) {
  const t = at || target(gm);
  const npc = npcAt(gm, t.x, t.y);
  if (npc) return { talk: npc };
  const bird = crowd.peafowlAt(gm, t.x, t.y);
  if (bird) return birdMeet(gm, bird);
  const r = interactAt(gm, t.x, t.y, true);
  if (r) return r;
  return useItemAt(gm, t.x, t.y);
}
function interactAt(gm, x, y, viaUse = false) {
  const S = gm.S;
  const bi = x >= 0 && y >= 0 && x < W && y < H ? gm.bmap[y * W + x] : -1;
  if (bi >= 0) {
    const b = gm.world.buildings[bi];
    switch (b.id) {
      case 'barn': return { board: true };
      case 'greenhouse': return { supplies: true };
      case 'storage': return { storage: true };
      case 'cafe': if (!cal.shopOpen(S, 'cafe')) { toast(gm, 'The Chipmunk Café grill is open 10 AM to 3 PM (and evenings during Holiday Lights).'); return { done: true }; } return { shop: 'cafe' };
      case 'welcome': if (!cal.shopOpen(S, 'gift')) { toast(gm, 'The GardenShop is closed right now.'); return { done: true }; } return { shop: 'gift' };
      case 'chapel': return { sign: 'chapel' };
      case 'pavilion': return { sign: 'pavilion' };
      case 'treehouse': return { sign: 'children' };
      case 'carillon': return { sign: 'chapel' };
      default: toast(gm, { brides: 'Millsap Bride\'s Hall.', grooms: 'Evans Groom\'s Quarters.', restroom: 'Restrooms.' }[b.id] || 'A building.'); return { done: true };
    }
  }
  const f = gm.fixed[key(x, y)];
  if (f) {
    const sel = selected(S);
    if (f.t === 'sign') return { sign: f.k };
    if (f.t === 'feeder') { if (count(S, 'seed')) return fillFeeder(gm, f); toast(gm, S.day - S.feedersDay < 5 ? 'The feeder is full. Chickadees and titmice are busy at it.' : 'This feeder is nearly empty. Bring bird seed from the greenhouse.'); return { done: true }; }
    if (f.t === 'fairy') { if (count(S, 'decor')) return fairyDecor(gm); toast(gm, 'The Fairy Village: tiny houses tucked among the roots. The decor changes with the seasons.'); return { done: true }; }
    if (f.t === 'venue') return venueUse(gm, f, sel);
    if (f.t === 'pergola') { toast(gm, 'Dooley Pergola.'); return { done: true }; }
    if (f.t === 'falls') { toast(gm, 'The waterfall.'); return { done: true }; }
  }
  return null;
}
function useItemAt(gm, x, y) {
  const S = gm.S, k = key(x, y);
  const sel = selected(S);
  const m = gm.markerMap[k];
  const record = rec(gm);
  if (!sel) { if (S.litter[k]) return garden.careAt(gm, x, y, 'grabber', record); return { none: true }; }
  const def = D.ITEMS[sel.id];
  if (def.kind === 'tool') {
    if (sel.id === 'reel') { if (m && (m.show === 'hl' || m.show === 'fall')) return withEnergy(gm, disp.reelOn(gm, m, record)); toast(gm, 'The light reel works on Holiday Lights pieces and the trees marked for wrapping.'); return { none: true }; }
    const r = garden.careAt(gm, x, y, sel.id, record);
    if (r) return withEnergy(gm, r);
    if (sel.id === 'grabber' && S.litter[k] === undefined) return { none: true };
    return { none: true };
  }
  if (def.kind === 'display') { if (!m) { toast(gm, 'Display pieces go on their marked spots (look for the stakes).'); return { none: true }; } return consume(gm, sel.id, disp.placePiece(gm, m, sel.id, record)); }
  if (def.kind === 'material') {
    if (['straw', 'annuals', 'cloth'].includes(sel.id) || sel.id.startsWith('bulb:')) return consume(gm, sel.id, garden.materialAt(gm, x, y, sel.id, record));
    toast(gm, { seed: 'Fill the feeders on the Birdsong Trail.', decor: 'This goes in the Fairy Village by the Treehouse.', kit: 'Set this up at today\'s wedding spot.' }[sel.id] || 'Nothing to do with that here.');
    return { none: true };
  }
  if (def.kind === 'food') return { eat: sel.id };
  if (def.kind === 'wear') { S.player.hat = def.hat; S.player.hatColor = def.hatColor; toast(gm, `You put on the ${def.name.toLowerCase()}.`); return { done: true }; }
  return { none: true };
}
function withEnergy(gm, r) {
  if (!r || !r.energy) return r;
  if (!C.spend(gm, r.energy)) return { none: true };
  return r;
}
function consume(gm, id, r) {
  if (!r || !r.used) return r || { none: true };
  if (r.energy && !C.spend(gm, r.energy)) return { none: true };
  removeItem(gm.S, id, 1);
  sound(gm, 'place');
  return { done: true, fx: r.fx };
}
function fillFeeder(gm, f) {
  const S = gm.S;
  removeItem(S, 'seed', 1);
  f.filled = S.day;
  orders.record(gm, 'feeders', 'hixson', 1);
  if (gm.feeders.every((x) => x.filled === S.day)) S.feedersDay = S.day;
  sound(gm, 'pickup'); toast(gm, 'Feeder filled.');
  return { done: true };
}
function fairyDecor(gm) {
  const S = gm.S, sea = cal.season(S);
  if (S.fairy === sea + cal.yearNo(S)) { toast(gm, 'The Fairy Village already has this season\'s decor.'); return { done: true }; }
  removeItem(S, 'decor', 1); S.fairy = sea + cal.yearNo(S);
  orders.record(gm, 'fairy', 'children', 1);
  toast(gm, { sp: 'Tiny tulips and a ribbon maypole.', su: 'Paper lanterns and a little lemonade stand.', fa: 'Acorn-cap pumpkins and a scarecrow the size of your thumb.', wi: 'Moss wreaths and a string of the smallest lights.' }[sea], 'good');
  sound(gm, 'craft');
  return { done: true };
}
function venueUse(gm, f, sel) {
  const S = gm.S, w = S.wedding;
  const names = { chapel: 'Anthony Chapel', pergola: 'Dooley Pergola', koi: 'Koi Pond Meadow' };
  if (!w || w.venue !== f.k) { toast(gm, `${names[f.k]}: a wedding site. ${w ? `Today's wedding is at ${w.name}.` : 'No wedding here today.'}`); return { done: true }; }
  if (!w.setup) {
    if (!count(S, 'kit')) { toast(gm, 'Bring the wedding kit from the greenhouse.'); return { done: true }; }
    removeItem(S, 'kit', 1); w.setup = true; orders.record(gm, 'wedding', null, 1);
    toast(gm, S.time < w.at ? 'Chairs out, arch up, aisle runner down. Ready for the couple.' : 'Set up, but late.', S.time < w.at ? 'good' : 'warn');
    sound(gm, 'place');
    return { done: true };
  }
  if (S.time < w.at + 120) { toast(gm, 'The ceremony is still to come or under way. Strike it after.'); return { done: true }; }
  if (!w.struck) { w.struck = true; addItem(S, 'kit', 1); orders.record(gm, 'unwed', null, 1); toast(gm, 'Wedding setup struck and packed.'); sound(gm, 'pickup'); return { done: true }; }
  toast(gm, 'All packed up.');
  return { done: true };
}
function birdMeet(gm, b) {
  const S = gm.S;
  if (S.peafowlInBeds[b.id]) {
    S.peafowlInBeds[b.id] = false; b.flee = true;
    for (const o of S.orders) if (o.type === 'peafowl' && o.bird === b.id && !o.done) { o.prog = 1; o.done = true; S.money += o.pay; toast(gm, `Order done: ${o.title} (+$${o.pay})`, 'quest'); }
    toast(gm, b.id === 'george' ? 'George gives you a long look and stalks off toward the café.' : 'The peahen hurries off, unbothered.');
    emit(gm, 'sound', { id: 'peacock' });
    return { done: true };
  }
  if (S.flags['admire' + b.id] !== S.day) { S.flags['admire' + b.id] = S.day; S.energy = Math.min(S.maxEnergy, S.energy + 4); }
  if (b.id === 'george' && !S.almanac.includes('g-george')) return { card: { kicker: 'The garden', title: 'George the peacock', paras: ['George eyes you, then your pockets, then fans his tail for nobody in particular.'], facts: ['g-george'] } };
  toast(gm, b.sex === 'm' ? (b.mode === 'fan' ? 'George fans his tail: a shimmering wall of eyes.' : 'George struts past, very pleased with himself.') : 'A peahen pecks at the gravel, ignoring you completely.');
  return { done: true };
}
function eat(gm, id) {
  const S = gm.S, def = D.ITEMS[id];
  if (!def || !def.energy || !count(S, id)) return false;
  if (S.energy >= S.maxEnergy) { toast(gm, 'You\'re not hungry.'); return false; }
  removeItem(S, id, 1);
  S.energy = Math.min(S.maxEnergy, S.energy + def.energy);
  sound(gm, 'eat'); toast(gm, `${def.name}. +${def.energy} energy.`);
  return true;
}

// ---------- buildings: board, supplies, storage, shops ----------
// The greenhouse supply bench hands out what today's work needs (free: it's the garden's stock).
function supplyList(gm) {
  const S = gm.S, d = cal.doy(S), out = [];
  out.push({ id: 'straw', max: 20, note: 'Mulch for the beds' });
  if (D.inWindow([D.yd('wi', 1), D.yd('wi', 19)], d)) for (const c of Object.keys(D.TULIP_COLORS)) out.push({ id: 'bulb:' + c, max: 20, note: 'Planting season' });
  if (D.inWindow([D.yd('sp', 15), D.yd('su', 20)], d)) out.push({ id: 'annuals', max: 20, note: 'Summer color' });

    <p>Visitors judge every area they walk through: litter, leaves on the paths, weeds and stale mulch in the beds, long grass, storm limbs, thirsty or overgrown plants, and dark light pieces all pull the <b>Garden Rating</b> down; flowers in bloom and a good show lift it. The rest of the crew and the volunteers handle part of the mess overnight.</p>

    <p>Facts come from the garden's own pages, the Encyclopedia of Arkansas, University of Arkansas news, the Sentinel-Record, Arkansas Tourism and others, collected in research/garvan-layout.md and research/garvan-operations.md; each card names its source. George the peacock is real; the two peahens are a game addition (a visitor report mentions a peahen, but no count is published). The 2026 kinetic art installation is not shown.</p>

      <p class="small">Tulip beds: ${t.planted}/${t.total} tiles planted (${t.right} to the design).</p>`;
  } else if (tab === 'staff') {
    body = `<ul class="list">${Object.entries(S.npcs).map(([id, n]) => { const p = D.PEOPLE[id], h = sim.hearts(n.pts); return `<li class="li"><canvas class="pp" data-pid="${id}" width="36" height="48" aria-hidden="true"></canvas><div class="grow"><b>${esc(p.name)}</b><div class="small muted">${esc(p.role)}</div></div><span class="hearts" aria-label="${h} of 5 hearts">${'♥'.repeat(h)}${'♡'.repeat(5 - h)}</span></li>`; }).join('')}</ul><p class="small muted">The staff are fictional. Talk to them daily; small gifts from the café go a long way.</p>`;
  } else {
    const ids = S.almanac;

  }

  document.querySelectorAll('canvas.pp').forEach((c) => { const id = c.dataset.pid; const ctx = c.getContext('2d'); portrait(ctx, id, 36, 48, 64) || ctx.drawImage(personSprite(id, D.PEOPLE[id].look, 'down', 0, 64), 0, 0, 36, 48); });
}
function repaintPortraits() {
  document.querySelectorAll('canvas.pp').forEach((c) => { const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); portrait(ctx, c.dataset.pid, 36, 48, 64); });
  const c = document.querySelector('.dialog .portrait'), id = c && c.dataset.pid;
  if (c && id) { const ctx = c.getContext('2d'); ctx.clearRect(0, 0, 84, 112); ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(0, 0, 84, 112); portrait(ctx, id, 84, 112, 160); }
}
function portrait(ctx, id, w, h, u) {
  const sp = PA.personSprite(id, D.PEOPLE[id].look, 'down', 'idle', u);
  if (!sp) return false;
  const cw = sp.c.width * 0.78, ch = cw * h / w;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sp.c, (sp.c.width - cw) / 2, sp.c.height * 0.03, cw, ch, 0, 0, w, h);
  return true;
}
function icon(id, cls = '') { return PA.iconHtml(id, cls) || `<img alt="" class="${cls}" src="${iconURL(id)}"${cls === 'big' ? ' width="40" height="40"' : ''}>`; }
function factHtml(id) {
  const f = FACT.get(id);
  if (!f) return '';
  const site = String(f.sourceUrl || '').replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
  return `<div class="fact">${esc(f.text)}<span class="src" title="${esc(f.sourceUrl)}">Source: ${esc(f.source)} · <span class="site">${esc(site)}</span></span></div>`;
}

function summaryScreen(gm, sum) {
  const S = gm.S;
  const notes = [];
  if (sum.storm) notes.push(`The storm brought down ${sum.storm} limbs.`);
  if (sum.freeze) notes.push(sum.freeze.burnt ? `The hard freeze burned ${sum.freeze.burnt} uncovered tulip bed tiles.` : 'The tulips came through the freeze under their frost cloth.');
  if (sum.wilting) notes.push(`${sum.wilting} plants are wilting in the heat. Water them.`);
  if (sum.dark) notes.push(`${sum.dark} light pieces went dark overnight.`);
  if (sum.crew) notes.push(`The install crew set ${sum.crew} piece${sum.crew > 1 ? 's' : ''} overnight.`);

}
function setupTouch() {

    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.transform = `translate(${dx * 0.6}px, ${dy * 0.6}px)`;
    if (len < 12) { app.pad.x = app.pad.y = 0; return; }
    const a = Math.atan2(dy, dx), oct = Math.round(a / (Math.PI / 4));

  document.getElementById('btn-a').addEventListener('pointerdown', (e) => { e.preventDefault(); unlock(); if (!app.ui.modal) app.queue.push({ k: 'use' }); });
  document.getElementById('btn-b').addEventListener('pointerdown', (e) => { e.preventDefault(); unlock(); if (!app.ui.modal) app.queue.push({ k: 'talk' }); });
}

// ---------- clicks on UI ----------
function cardNext() { closeModal(); }

  const el = e.target.closest('[data-act]');

  const gm = app.gm;
  switch (act) {
    case 'open': openModal(arg); break;
    case 'close': closeModal(); break;
    case 'cardnext': cardNext(); break;
    case 'continue': continueGame(); break;
    case 'newgame': newGame({}); break;
    case 'title': toTitle(); break;
    case 'save': ui.toast(saveGame() ? 'Game saved.' : 'Saving is unavailable here.', 'good'); break;
    case 'hot': gm.S.sel = +arg; break;
    case 'slot': {
      const i = +arg;
      if (app.ui.invPick != null && app.ui.invPick !== i) { sim.swapSlots(gm.S, app.ui.invPick, i); app.ui.invPick = null; }
      else { app.ui.invPick = app.ui.invPick === i ? null : i; if (i < sim.HOTBAR) gm.S.sel = i; }
      refreshModal(); break;
    }
    case 'eat': sim.eat(gm, arg); drainEvents(); refreshModal(); break;
    case 'buy': { const [shop, id, n] = arg.split('|'); sim.buy(gm, shop, id, +n); drainEvents(); refreshModal(); break; }
    case 'supply': { const [id, n] = arg.split('|'); sim.takeSupply(gm, id, +n); drainEvents(); refreshModal(); break; }
    case 'storage': if (arg === 'take') sim.storageTake(gm); else sim.storageReturn(gm); drainEvents(); refreshModal(); break;
    case 'jtab': app.ui.jTab = arg; refreshModal(); break;
    case 'give': { const sel = sim.selected(gm.S); const r = sim.give(gm, arg, sel && sel.id); drainEvents(); if (r && r.text) { const d = { ...app.ui.data, giftText: r.text, hearts: sim.hearts(gm.S.npcs[arg].pts) }; openModal('dialog', d); } break; }
    case 'sleep': closeModal(); sim.sleep(gm); drainEvents(); break;
    case 'text': app.settings.text = +arg; saveSettings(); applySettings(); refreshModal(); break;
    case 'motion': app.settings.motion = arg; saveSettings(); applySettings(); refreshModal(); break;
    case 'touch': app.settings.touch = arg; saveSettings(); applySettings(); refreshModal(); break;
    case 'mute': app.settings.mute = arg === 'on'; saveSettings(); applySettings(); refreshModal(); break;
    case 'vol': app.settings.volume = +arg; app.settings.mute = false; saveSettings(); applySettings(); play('coin'); refreshModal(); break;
    case 'contrast': app.settings.contrast = arg === 'on'; saveSettings(); applySettings(); refreshModal(); break;
    case 'gfx': if (app.settings.gfx !== arg) { app.settings.gfx = arg; saveSettings(); ui.toast(arg === 'simple' ? 'Simple graphics from the next start (reload the page).' : 'Painted graphics from the next start (reload the page).', 'good'); } refreshModal(); break;

// ---------- loop ----------
let acc = 0, lastT = 0;
function frame(now) {

  const ms = performance.now() - t0;

  app.frameMax = Math.max(app.frameMax || 0, ms);
}
function frameBody(now) {
  const dt = Math.min(0.25, lastT ? (now - lastT) / 1000 : 0); lastT = now;
  if (app.ui.scene === 'title') { if (!app.lastRenderTitle || app.titleArt !== ART.loaded) renderTitle(); return; }
  if (!app.gm) return;
  if (!app.paused && !app.ui.modal) {
    acc += dt;
    let n = 0;
    while (acc >= 1 / 60 && n < 10) { tickOnce(); acc -= 1 / 60; n++; }

  } else { acc = 0; if (app.queue.length && !app.ui.modal) tickOnce(); }
  if (app.ui.modal && app.portraitArt !== ART.loaded && PA.peopleReady()) { app.portraitArt = ART.loaded; ui.repaintPortraits(); }
  if (!app.ui.modal || app.dirty || ART.dirty) render();
}
const TALKISH = /^(Talk|Open|Read|Admire|Shoo|Bird|Fairy|Wedding|Dooley|Waterfall)/;
function render() {
  const gm = app.gm;
  if (!app.wantedAll) wantAll();
  scene.draw(gm, { showTarget: !app.ui.modal && app.ui.scene === 'game' });
  ui.hud(gm);
  const pr = document.getElementById('prompt');
  const txt = app.ui.modal ? '' : ui.describeTarget(gm);
  if (txt) { const talk = TALKISH.test(txt); const key = touchWanted() ? (talk ? 'B' : 'A') : ui.keyName(app.settings.keys[talk ? 'talk' : 'use'][0]); const s = `${key}: ${txt}`; if (pr.textContent !== s) pr.textContent = s; pr.hidden = false; }
  else pr.hidden = true;
  app.dirty = false;
}
function renderTitle() {
  const c = scene.R.canvas, ctx = scene.R.ctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  want(['vista-garvan']);
  scene.vista(ctx, c.width, c.height);
  app.lastRenderTitle = true; app.titleArt = ART.loaded;
}

// ---------- test hooks ----------
function compact() {
  const gm = app.gm;
  const base = { scene: app.ui.scene, modal: app.ui.modal, paused: app.paused, reduced: scene.R.reduced, loadMs: app.loadMs, settings: { ...app.settings, keys: app.settings.keys }, storageOK: app.storageOK, toasts: app.toastLog.slice(-8), ts: scene.R.ts, touch: touchWanted(), audioPlayed: audioState.played, artCache: artCacheSize() };
  if (!gm) return base;
  const S = gm.S;
  const t = sim.target(gm);
  const d = sim.doy(S);
  return {
    ...base, year: sim.yearNo(S), day: S.day, doy: d, season: sim.season(S), dayOfSeason: sim.dayOfSeason(S), date: sim.dateLabel(S), realDate: sim.realDate(d),
    time: S.time, clock: sim.clock(S), weather: S.weather, freezeTonight: S.freezeTonight, money: S.money, energy: S.energy, maxEnergy: S.maxEnergy, seed: S.seed, tier: S.tier, rating: S.rating, hours: sim.hours(S),
    player: { x: +S.player.x.toFixed(3), y: +S.player.y.toFixed(3), tx: Math.floor(S.player.x), ty: Math.floor(S.player.y - 0.1), face: S.player.face, moving: S.player.moving },
    zone: sim.zoneAt(gm, Math.floor(S.player.x), Math.floor(S.player.y - 0.1)).id,
    target: { x: t.x, y: t.y }, sel: S.sel, selItem: sim.selected(S)?.id || null, can: S.can,
    inv: S.inv.filter(Boolean).map((i) => ({ id: i.id, n: i.n })), invSlots: S.inv.map((i) => (i ? i.id : null)),
    orders: S.orders.map((o) => ({ id: o.id, type: o.type, zone: o.zone, n: o.n, prog: o.prog, done: o.done, title: o.title })),
    counts: { litter: Object.keys(S.litter).length, leaves: Object.keys(S.leaves).length, weeds: Object.keys(S.weeds).length, grass: Object.keys(S.grass).length, beds: Object.keys(S.beds).length, limbs: Object.values(S.objs).filter((o) => o.t === 'limb').length, disp: Object.keys(S.disp).length },
    visitors: S.visitors.length, peafowl: S.peafowl.map((b) => ({ id: b.id, x: +b.x.toFixed(2), y: +b.y.toFixed(2), mode: b.mode })), wedding: S.wedding,
    npcs: Object.entries(S.npcs).map(([id, n]) => ({ id, x: +n.x.toFixed(2), y: +n.y.toFixed(2), tx: Math.floor(n.x), ty: Math.floor(n.y - 0.1), place: n.place, hidden: n.hidden, pts: n.pts, hearts: sim.hearts(n.pts) })),
    almanac: S.almanac.length, almanacIds: S.almanac, summary: S.summary, ys: S.ys,
    places: gm.world.places, buildings: gm.world.buildings.map((b) => ({ id: b.id, type: b.type, x: b.x, y: b.y, w: b.w, h: b.h, front: b.front, label: b.label })),
    chunkBakes: scene.R.chunkBakes, bakeMs: +(scene.R.bakeMs || 0).toFixed(1), bakeLog: (scene.R.bakeLog || []).slice(), artLoaded: ART.loaded, artPending: ART.pending, artFailed: ART.failed.slice(), artTotal: allNames().length, vectorFallback: [...scene.R.fallback],
    painted: { terrain: terrainReady(), people: PA.peopleReady() }, frames: scene.R.frames, particles: scene.R.particles.length, frameMs: +(app.frameMs || 0).toFixed(2), srText: document.getElementById('sr').textContent, cam: { ...scene.R.cam }, autoPath: S.autoPath ? S.autoPath.length : 0,
  };
}
function deepMerge(t, p) {

    if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) deepMerge(t[k], v);
    else t[k] = v;

}
const hooks = {
  seed(n) { app.seed = n >>> 0; if (app.gm) app.gm.S.rs = hash(n, 'run') | 0; return n; },
  getState: compact,
  setState(p = {}) {
    const gm = app.gm; if (!gm) return compact();
    const S = gm.S;
    const q = { ...p };
    if (q.inv) { S.inv = new Array(24).fill(null); q.inv.forEach((it, i) => { if (it) S.inv[i] = { id: it.id, n: it.n ?? 1 }; }); delete q.inv; }
    if (q.player) { const pl = q.player; if (pl.tx != null) { S.player.x = pl.tx + 0.5; S.player.y = pl.ty + 0.9; } if (pl.face) S.player.face = pl.face; delete q.player; }
    if (q.npcs) { for (const [id, v] of Object.entries(q.npcs)) Object.assign(S.npcs[id] || {}, v); delete q.npcs; }
    for (const k of ['weeds', 'leaves', 'litter', 'grass', 'beds', 'disp', 'covered', 'watered']) if (q[k]) { S[k] = q[k]; delete q[k]; }
    if (q.objs) { Object.assign(S.objs, q.objs); for (const [k, v] of Object.entries(q.objs)) if (v == null) delete S.objs[k]; delete q.objs; }
    deepMerge(S, q);
    gm.navVersion++; gm.zcache = null;
    scene.snapCamera(gm); ui.resetHud(); app.dirty = true; render();
    return compact();
  },
  isIdle() { return ART.pending === 0 && app.fontsReady !== false; },
  step(n = 1) { app.paused = true; for (let i = 0; i < n; i++) tickOnce(); if (app.ui.scene === 'game' && app.gm) render(); return compact(); },
  pause() { app.paused = true; return true; },
  resume() { app.paused = false; return true; },
  scene(name) {
    if (name && typeof name === 'object') {
      const gm = sim.newGame({ seed: app.seed ?? 1, day: name.day, money: name.money });
      startGame(gm, false);
      if (name.time != null) gm.S.time = name.time;
      if (name.weather) gm.S.weather = name.weather;
      if (name.at) { const p = gm.world.places[name.at]; if (p) { gm.S.player.x = p.x + 0.5; gm.S.player.y = p.y + 0.9; } }
      if (name.tx != null) { gm.S.player.x = name.tx + 0.5; gm.S.player.y = name.ty + 0.9; }
      if (name.paused !== false) app.paused = true;
      scene.snapCamera(gm); render();
      return compact();
    }
    if (name === 'title') { toTitle(); return compact(); }
    if (name === 'game') { if (!app.gm) newGame({ seed: app.seed ?? 1, noSave: true }); app.ui.scene = 'game'; closeModal(true); layoutVisibility(); render(); return compact(); }
    if (!app.gm && !['settings', 'help', 'about'].includes(name)) newGame({ seed: app.seed ?? 1, noSave: true });

  newGame(opts = {}) { newGame({ ...opts }); if (opts.paused) app.paused = true; render(); return compact(); },
  act(name, ...args) {

      switch (name) {
        case 'use': doUse(); return true;
        case 'interact': case 'talkKey': doTalk(); return true;
        case 'useAt': doUse({ x: args[0], y: args[1] }); return true;
        case 'face': gm.S.player.face = args[0]; return true;
        case 'select': gm.S.sel = args[0]; return true;
        case 'selectItem': { const i = gm.S.inv.findIndex((it) => it && it.id === args[0]); if (i >= 0) { if (i >= sim.HOTBAR) { sim.swapSlots(gm.S, i, sim.HOTBAR - 1); gm.S.sel = sim.HOTBAR - 1; } else gm.S.sel = i; } return i >= 0; }
        case 'teleport': gm.S.player.x = args[0] + 0.5; gm.S.player.y = args[1] + 0.9; if (args[2]) gm.S.player.face = args[2]; scene.snapCamera(gm); return true;
        case 'goto': { const p = gm.world.places[args[0]]; if (!p) return false; gm.S.player.x = p.x + 0.5; gm.S.player.y = p.y + 0.9; gm.S.player.face = args[1] || 'up'; scene.snapCamera(gm); return true; }
        case 'buy': return sim.buy(gm, args[0], args[1], args[2] ?? 1);
        case 'supply': return sim.takeSupply(gm, args[0], args[1] ?? 1);
        case 'storageTake': return sim.storageTake(gm);
        case 'storageReturn': return sim.storageReturn(gm);
        case 'eat': return sim.eat(gm, args[0]);
        case 'sleep': closeModal(true); sim.sleep(gm); return true;
        case 'sleepSkip': { closeModal(true); sim.sleep(gm); const evs = gm.events.splice(0); evs.filter((e) => e.type === 'toast').forEach((e) => app.toastLog.push(e.text)); saveGame(); return true; }

        case 'talk': { const d = sim.talk(gm, args[0]); if (d) openModal('dialog', d); return d; }
        case 'give': return sim.give(gm, args[0], args[1]);
        case 'card': openModal('card', { kicker: 'Garden notes', title: args[1] || 'Garden notes', facts: args[0] || [] }); return true;
        case 'toast': ui.toast(args[0]); return true;
        case 'close': closeModal(); return true;
        case 'closeAll': closeModal(true); return true;
        case 'cardNext': cardNext(); return true;
        case 'save': return saveGame();
        case 'reloadSave': return continueGame();
        case 'loadRaw': { try { const s = save.parse(args[0]); startGame(sim.attach(s), false); return true; } catch (e) { return String(e.message); } }
        case 'rawSave': return load(save.SAVE_KEY);
        case 'fill': { for (const [id, n] of args[0]) sim.addItem(gm.S, id, n); return true; }
        case 'objAt': { const o = sim.objAt(gm, args[0], args[1]); return o ? { ...o } : null; }
        case 'blocked': return sim.blocked(gm, args[0], args[1]);
        case 'ground': return sim.ground(gm, args[0], args[1]);
        case 'describe': return ui.describeTarget(gm);
        case 'zones': return sim.zoneStats(gm).map((z, i) => ({ i, tidy: z.tidy, score: z.score }));
        case 'goals': return sim.goals(gm);
        case 'markers': return gm.world.markers.map((m) => ({ ...m, st: gm.S.disp[m.id] ? gm.S.disp[m.id].st : null }));
        case 'design': { const b = gm.bedMap[args[0] + ',' + args[1]]; return b ? sim.tulipDesign(b, args[0], args[1], sim.yearNo(gm.S)) : null; }

  },
};
window.__game = hooks;

    Promise.all(FONT_FAMILIES.map((f) => document.fonts.load(`700 20px "${f}"`).catch(() => null))).then(() => { app.fontsReady = true; clearArt(); app.lastRenderTitle = false; app.dirty = true; });

  window.addEventListener('blur', () => { app.held.clear(); app.pad.x = app.pad.y = 0; });
  document.getElementById('view').addEventListener('pointerdown', canvasPointer);
  document.getElementById('view').addEventListener('wheel', (e) => { if (app.gm && !app.ui.modal && app.ui.scene === 'game') { app.gm.S.sel = (app.gm.S.sel + (e.deltaY > 0 ? 1 : sim.HOTBAR - 1)) % sim.HOTBAR; e.preventDefault(); } }, { passive: false });

})();
